<section class="updates is-film is-punch" id="updates" aria-labelledby="updates-h">
  <div class="updates-film" aria-hidden="true">
    <video data-src="assets/video/loop-1280.mp4" data-src-small="assets/video/loop-960.mp4" preload="none" autoplay muted loop playsinline></video>
  </div>
  <div class="container">
    <div class="kicker is-span">
      <span class="k">Event updates</span>
      <span class="rule" aria-hidden="true"></span>
      <span class="k k-num" aria-hidden="true">09</span>
    </div>
    <div class="updates-grid">
      <div>
        <h2 class="h2-display" id="updates-h">Stay in the loop.</h2>
        <p class="updates-copy">Get upcoming event announcements and booking details from Jersey, Guernsey and the Isle of Man, straight to your inbox.</p>
      </div>
      <form class="signup th-card" id="signup" novalidate data-endpoint="">
        <label class="signup-label" for="signup-email">Your email address</label>
        <div class="signup-row">
          <input class="signup-input" id="signup-email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="signup-note signup-status">
          <button class="btn btn-solid signup-btn" type="submit">Keep me in the loop <span aria-hidden="true">&rarr;</span></button>
        </div>
        <p class="signup-note" id="signup-note">Sign up to receive TEKEX event emails. Unsubscribe at any time. <a href="https://www.tekex.co/privacy-policy">Privacy notice</a></p>
        <p class="signup-status" id="signup-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>
</section>
