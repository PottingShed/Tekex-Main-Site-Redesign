<!-- The gradient map every photograph is printed through. Its tables are
     written by js/site.js from the active pair's tokens, so the same b/w
     shot prints blue-on-butter on one visit and red-on-pink the next.
     Without JS the photos simply stay greyscale. -->
<svg class="print-defs" aria-hidden="true" focusable="false" width="0" height="0">
  <filter id="tkx-print" color-interpolation-filters="sRGB" x="0" y="0" width="1" height="1">
    <feColorMatrix type="matrix" values=".2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  0 0 0 1 0"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0 1"/>
      <feFuncG type="table" tableValues="0 1"/>
      <feFuncB type="table" tableValues="0 1"/>
    </feComponentTransfer>
  </filter>
</svg>
